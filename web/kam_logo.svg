<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="obsidianSeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="70%" stop-color="#090D14"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>
    <linearGradient id="titaniumLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="titaniumDark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cyanCircuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Outer Obsidian Medallion -->
  <circle cx="256" cy="256" r="246" fill="url(#obsidianSeal)" stroke="url(#titaniumLight)" stroke-width="4"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#475569" stroke-width="1"/>

  <!-- Precision Radar Telemetry Ticks -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#94A3B8" stroke-width="8" stroke-dasharray="2 8.18"/>
  <circle cx="256" cy="256" r="212" fill="none" stroke="#475569" stroke-width="1.2"/>
  <circle cx="256" cy="256" r="184" fill="none" stroke="#334155" stroke-width="1"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Polar Grid Axes -->
  <g stroke="#334155" stroke-width="1">
    <line x1="256" y1="44" x2="256" y2="468"/>
    <line x1="44" y1="256" x2="468" y2="256"/>
    <line x1="106" y1="106" x2="406" y2="406"/>
    <line x1="406" y1="106" x2="106" y2="406"/>
  </g>

  <!-- 8-Pointed Sovereign Octagram (Seljuk / Turkic Star of Order & Wisdom) -->
  <polygon points="
    256,64 294,158 392,120 354,218 448,256 354,294 392,392 294,354
    256,448 218,354 120,392 158,294 64,256 158,218 120,120 218,158"
    fill="#0B101B" stroke="url(#titaniumLight)" stroke-width="6" stroke-linejoin="miter"/>

  <!-- Inner Octagram Facet -->
  <polygon points="
    256,96 284,172 362,150 340,228 416,256 340,284 362,362 284,340
    256,416 228,340 150,362 172,284 96,256 172,228 150,150 228,172"
    fill="#070B12" stroke="url(#titaniumDark)" stroke-width="2.5" stroke-linejoin="miter"/>

  <!-- Electric Cyan Silicon Neural Pathways -->
  <g stroke="url(#cyanCircuit)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="256" y1="128" x2="256" y2="168"/>
    <line x1="256" y1="344" x2="256" y2="384"/>
    <line x1="128" y1="256" x2="168" y2="256"/>
    <line x1="344" y1="256" x2="384" y2="256"/>
    <polyline points="176,176 212,196 228,220"/>
    <polyline points="336,176 300,196 284,220"/>
    <polyline points="176,336 212,316 228,292"/>
    <polyline points="336,336 300,316 284,292"/>
    <circle cx="244" cy="156" r="4" fill="#090D14"/>
    <circle cx="268" cy="156" r="4" fill="#090D14"/>
    <circle cx="244" cy="356" r="4" fill="#090D14"/>
    <circle cx="268" cy="356" r="4" fill="#090D14"/>
    <circle cx="156" cy="244" r="4" fill="#090D14"/>
    <circle cx="156" cy="268" r="4" fill="#090D14"/>
    <circle cx="356" cy="244" r="4" fill="#090D14"/>
    <circle cx="356" cy="268" r="4" fill="#090D14"/>
  </g>

  <!-- Central Sovereign Apex Chevrons -->
  <polygon points="256,166 290,236 272,236 256,202 240,236 222,236" fill="url(#titaniumLight)"/>
  <polygon points="178,214 256,284 334,214 316,258 256,314 196,258" fill="url(#titaniumLight)" stroke="#00F2FE" stroke-width="1.5"/>
  <polygon points="198,270 256,324 314,270 296,306 256,352 216,306" fill="url(#titaniumDark)" stroke="#00F2FE" stroke-width="1.5"/>
</svg>
