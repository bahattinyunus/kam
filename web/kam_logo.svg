<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degrade Renkler -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <radialGradient id="bgRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#06080d" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#030407" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- Filtreler: Siber Parlama -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Arka Plan Dairesi -->
  <circle cx="256" cy="256" r="250" fill="url(#bgRadial)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" />
  <circle cx="256" cy="256" r="230" fill="url(#coreGlow)" />

  <!-- Dış Şaman Davulu (Tüngür) Çemberi & 8 Kozmik Yön Tamgası -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#cyanGlow)" stroke-width="2.5" stroke-dasharray="14 8" opacity="0.65" />
  <circle cx="256" cy="256" r="214" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- 8 Kardinal Yön İşaretleri (Kuzey, Güney, Doğu, Batı ve Ara Yönler) -->
  <g stroke="url(#cyanGlow)" stroke-width="2" opacity="0.8">
    <line x1="256" y1="20" x2="256" y2="36" />
    <line x1="256" y1="476" x2="256" y2="492" />
    <line x1="20" y1="256" x2="36" y2="256" />
    <line x1="476" y1="256" x2="492" y2="256" />
    <!-- Ara Yönler -->
    <line x1="89" y1="89" x2="101" y2="101" />
    <line x1="423" y1="423" x2="411" y2="411" />
    <line x1="423" y1="89" x2="411" y2="101" />
    <line x1="89" y1="423" x2="101" y2="411" />
  </g>

  <!-- Siber Sinir Devre Hatları (eBPF Nöral Filamentleri) -->
  <g fill="none" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.5">
    <path d="M 120 256 L 160 256 L 190 290 L 190 350 L 160 380" />
    <circle cx="120" cy="256" r="3" fill="#00f2fe" />
    <circle cx="160" cy="380" r="3" fill="#00f2fe" />

    <path d="M 392 256 L 352 256 L 322 290 L 322 350 L 352 380" />
    <circle cx="392" cy="256" r="3" fill="#00f2fe" />
    <circle cx="352" cy="380" r="3" fill="#00f2fe" />

    <path d="M 210 110 L 210 140 L 170 170" />
    <circle cx="170" cy="170" r="2.5" fill="#c084fc" />
    <path d="M 302 110 L 302 140 L 342 170" />
    <circle cx="342" cy="170" r="2.5" fill="#c084fc" />
  </g>

  <!-- GÖK BÖRÜ // SİBERNETİK KURT BAŞI SİLUETİ (Geometrik ve Asil Vektör) -->
  <g id="wolf-crest" filter="url(#neonFilter)">
    <!-- Sol Kulak -->
    <polygon points="256,190 200,90 232,185" fill="url(#cyanGlow)" opacity="0.9" />
    <polygon points="220,130 200,90 232,185" fill="#06080d" opacity="0.4" />

    <!-- Sağ Kulak -->
    <polygon points="256,190 312,90 280,185" fill="url(#cyanGlow)" opacity="0.9" />
    <polygon points="292,130 312,90 280,185" fill="#06080d" opacity="0.4" />

    <!-- Alın ve Taç Plakası -->
    <polygon points="256,165 220,195 256,225 292,195" fill="url(#purpleGlow)" opacity="0.85" />

    <!-- Şimşek / Aşina Tamgası (Alındaki Kozmik Enerji) -->
    <polygon points="258,155 248,188 259,188 252,215 266,180 255,180" fill="url(#goldAccent)" filter="url(#subtleGlow)" />

    <!-- Sol Yanak / Şakak Kemikleri -->
    <polygon points="220,195 165,225 190,285 226,245" fill="url(#cyanGlow)" opacity="0.8" />
    <polygon points="190,285 160,320 220,315 226,245" fill="url(#purpleGlow)" opacity="0.7" />

    <!-- Sağ Yanak / Şakak Kemikleri -->
    <polygon points="292,195 347,225 322,285 286,245" fill="url(#cyanGlow)" opacity="0.8" />
    <polygon points="322,285 352,320 292,315 286,245" fill="url(#purpleGlow)" opacity="0.7" />

    <!-- Burun Köprüsü ve Orta Yüz -->
    <polygon points="256,225 226,245 236,310 256,330 276,310 286,245" fill="#0b1329" stroke="url(#cyanGlow)" stroke-width="1.5" />

    <!-- Gök Mavisi Gözler -->
    <polygon points="214,235 236,242 222,250" fill="#00f2fe" filter="url(#subtleGlow)" />
    <polygon points="298,235 276,242 290,250" fill="#00f2fe" filter="url(#subtleGlow)" />

    <!-- Çene ve Ağız Yapısı -->
    <polygon points="236,310 256,330 256,365 242,350" fill="url(#cyanGlow)" opacity="0.85" />
    <polygon points="276,310 256,330 256,365 270,350" fill="url(#cyanGlow)" opacity="0.85" />
    <polygon points="256,365 250,385 256,395 262,385" fill="url(#cyanGlow)" />

    <!-- Boyun Zırhı ve Göktürk Kanat Plakaları -->
    <polygon points="220,315 180,360 225,375 242,350" fill="#0f172a" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
    <polygon points="292,315 332,360 287,375 270,350" fill="#0f172a" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
  </g>

  <!-- Alt Rünik Göktürk / Latin KAM Tipografisi -->
  <g id="brand-text">
    <line x1="160" y1="425" x2="352" y2="425" stroke="url(#cyanGlow)" stroke-width="1.5" opacity="0.6" />
    <circle cx="160" cy="425" r="3" fill="#00f2fe" />
    <circle cx="256" cy="425" r="4" fill="#f59e0b" filter="url(#subtleGlow)" />
    <circle cx="352" cy="425" r="3" fill="#00f2fe" />

    <text x="256" y="462" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="10" fill="#ffffff">
      KAM
    </text>

    <text x="256" y="482" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" letter-spacing="3" fill="url(#cyanGlow)" opacity="0.85">
      BİLİŞSEL OTONOM ZİHİN
    </text>
  </g>
</svg>