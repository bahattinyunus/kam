name: KAM Bilişsel Motor CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: C++ Derleme Bağımlılıklarını Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++-13 libbpf-dev linux-tools-common
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100

    - name: Python Ortamını Hazırla
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Python Birim Testleri ve Simülasyon
      run: |
        python scripts/fetch_open_datasets.py
        python scripts/setup_local_brain.py
        python -m unittest discover tests
        python cli.py --scenario uav_failure
        python cli.py --scenario swarm_loss
        python cli.py --infer
        python cli.py --train
        python cli.py --benchmark
        python cli.py --export-metrics
        python cli.py --mcp

    - name: C++20 Projesini Derle
      run: |
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        make -j$(nproc)

    - name: C++ Senaryolarını Çalıştır
      run: |
        cd build
        ./kam_uav_scenario
        ./kam_edge_recovery
        ./kam_jamming_attack
        ./kam_deep_space_bitflip
        ./kam_can_spoofing
        ./kam_thermal_mitigation
        ./kam_swarm_loss
        ./kam_liquid_demo
